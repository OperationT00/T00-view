spring:
  application:
    name: media-vault
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/media_vault?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:media_vault}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 10000
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: strict
  error:
    include-message: never
    include-stacktrace: never
vault:
  bootstrap:
    username: ${BOOTSTRAP_USERNAME:}
    password: ${BOOTSTRAP_PASSWORD:}
pikpak:
  enabled: ${PIKPAK_ENABLED:false}
  secret-key: ${PIKPAK_SECRET_KEY:}
  proxy-url: ${PIKPAK_PROXY_URL:}
